name: Build desktop apps

# Builds the Windows installer and the macOS apps (Apple silicon + Intel).
# - On a version tag (v2.0.0): a final job collects the three builds and
#   attaches them to the GitHub Release for that tag (created once, with
#   generated release notes).
# - On pull requests and manual runs: the installers are available as
#   workflow artifacts (nothing is published).

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            args: --win
          - os: macos-latest
            name: mac-arm64
            args: --mac --arm64
          - os: macos-15-intel
            name: mac-x64
            args: --mac --x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Package with electron-builder
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List output
        shell: bash
        run: ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: community-titler-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  release:
    name: Publish the GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: community-titler-*
          merge-multiple: true
          path: release

      - name: List collected installers
        run: ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
          generate_release_notes: true
